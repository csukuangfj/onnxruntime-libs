name: aarch64-shared-217

on:
  push:
    branches:
      - release-v1.31.0-2
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.31.0)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.31.0' }}

jobs:
  aarch64-shared-217:
    name: ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm]
        arch: [aarch64]
        config: ['Debug', 'MinSizeRel', 'Release', 'RelWithDebInfo']
        # config: ['MinSizeRel', 'Release']
        # config: ['Release']

    steps:
      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}-cache-v1

      - name: Checkout v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          submodules: true
          ref: v${{ env.ONNXRUNTIME_VERSION }}

      - name: patch
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sed -i.bak '/SOVERSION/d' ./cmake/onnxruntime.cmake
          sed -i.bak '/onnxruntime PROPERTIES VERSION/d' ./cmake/onnxruntime.cmake

          git diff

          sudo apt-get install -y patchelf

      - name: Build onnxruntime ${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: addnab/docker-run-action@v3
        with:
            # image: quay.io/pypa/manylinux2014_aarch64
            #
            # onnxruntime v1.22.0   GCC version must be greater than or equal to 11.1
            # https://github.com/pypa/manylinux?tab=readme-ov-file#manylinux_2_28-almalinux-8-based
            #
            # https://github.com/pypa/manylinux/issues/1266
            # image: quay.io/pypa/manylinux_2_28_aarch64 # onnxruntime v1.22.0 requires gcc >= 11
            # image: quay.io/pypa/manylinux2014_aarch64 # it has only gcc 10. gcc 11 cannot be installed on it
            image: ghcr.io/csukuangfj/manylinux2014-aarch64-gcc11:latest # i have built gcc 11 from source
            options: |
              --volume ${{ github.workspace }}/:/shared
            shell: bash
            run: |
              echo "config: ${{ matrix.config }}"
              uname -a
              which gcc

              gcc --version
              which python
              ldd --version

              # find /opt -name "python*"

              echo "--------------------"
              PYBIN_DIR=$(find /opt/_internal -type d -path '*/cpython-3.10.*/bin' -print -quit)
              echo "PYBIN_DIR: $PYBIN_DIR"

              export PATH=$PYBIN_DIR:$PATH
              which python3
              python3 --version
              python3 -m pip install ninja

              cd /shared
              ls -lh
              touch /shared/a.txt
              mkdir build-shared

              version=${{ env.ONNXRUNTIME_VERSION }}
              which python
              # v=$(cat ./VERSION_NUMBER)
              # if [[ $v == "1.18.0" ]]; then
              #   echo $version > ./VERSION_NUMBER
              #   sed -i.bak s/1.18.0/$version/g ./onnxruntime/core/session/onnxruntime_c_api.cc
              # fi

              # echo "---$version---"
              # cat ./VERSION_NUMBER
              # echo "---"
              #
              # ✅ FORCE GCC 11
              export GCC_ROOT=/opt/gcc-11.4.0
              export CC=$GCC_ROOT/bin/gcc
              export CXX=$GCC_ROOT/bin/g++
              export PATH=$GCC_ROOT/bin:$PATH

              export CMAKE_CXX_FLAGS="${CMAKE_CXX_FLAGS:-} -static-libstdc++ -static-libgcc"
              export CMAKE_C_FLAGS="${CMAKE_C_FLAGS:-} -static-libgcc"

              gcc --version
              which gcc

              g++ --version
              which g++

              which python

              build_dir=/shared/build-shared

              # Fail the step if the build fails. Without this a non-zero exit
              # from build.py is swallowed and the job only fails later in
              # Collect results with a confusing 'cannot stat' error.
              set -e


              # -static-libstdc++ so the .so carries its own libstdc++ (no
              # GLIBCXX requirement on the target). The old ABI is asked for
              # explicitly; the C++11 ABI relies on the toolchain default.
              python3 tools/ci_build/build.py \
                --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF \
                --cmake_extra_defines CMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc" \
                --cmake_extra_defines CMAKE_C_FLAGS="-static-libgcc" \
                --build_dir $build_dir \
                --cmake_generator 'Ninja' \
                --config ${{ matrix.config }} \
                --update \
                --build \
                --parallel \
                --skip_tests \
                --compile_no_warning_as_error \
                --build_shared_lib \
                --skip_submodule_sync \
                --enable_lto \
                --allow_running_as_root

              chmod a=rwx build-shared
              ls -lh build-shared
              ls -lh build-shared/*

      - name: Collect results
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          build_dir=./build-shared
          config=${{ matrix.config }}
          version=${{ env.ONNXRUNTIME_VERSION }}

          sudo chown -R runner $build_dir
          ls -lh $build_dir

          artifact=onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}

          tag=$(git rev-parse HEAD)
          echo "tag: $tag"

          pushd ./tools/ci_build/github/linux
          rm copy_strip_binary.sh
          wget https://github.com/microsoft/onnxruntime/raw/v1.18.1/tools/ci_build/github/linux/copy_strip_binary.sh
          chmod +x copy_strip_binary.sh
          ls -lh
          popd

          ./tools/ci_build/github/linux/copy_strip_binary.sh \
            -r $build_dir \
            -a $artifact \
            -c $config \
            -l libonnxruntime.so \
            -s $PWD/ \
            -t "$(git rev-parse HEAD)"

          mv $build_dir/$artifact ./
          tree ./$artifact

          # ldd ./$artifact/lib/libonnxruntime.so
          readelf -d ./$artifact/lib/libonnxruntime.so

          patchelf --set-soname libonnxruntime.so ./$artifact/lib/libonnxruntime.so

          # ldd ./$artifact/lib/libonnxruntime.so
          readelf -d ./$artifact/lib/libonnxruntime.so

          strings  ./$artifact/lib/libonnxruntime.so | grep "^GLIBC_"

          zip -r ${artifact}.zip ./$artifact

      # The cache restores the artifact directory, but only Collect results
      # makes the zip -- and that needs the checkout and build tree, so it is
      # skipped on a cache hit. Zip here so there is always something to upload.
      - name: Zip the artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}
          if [ -f "$artifact.zip" ]; then
            echo "already zipped: $artifact.zip"
          else
            zip -r "$artifact.zip" "./$artifact"
          fi
          ls -lh "$artifact.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}
          path: onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}.zip

  test:
    name: test ${{ matrix.config }}
    needs: aarch64-shared-217
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm]
        arch: [aarch64]
        config: ['Debug', 'MinSizeRel', 'Release', 'RelWithDebInfo']
        # config: ['MinSizeRel', 'Release']
        # config: ['Release']
    steps:
      # This repo's tests/, unlike the build job which checks out
      # microsoft/onnxruntime to compile it.
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download the artifact the build job made
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-linux-${{ matrix.arch }}-glibc2_17-${{ matrix.config }}-${{ env.ONNXRUNTIME_VERSION }}
          path: .

      # Test inside the manylinux *base* image, i.e. the actual old distro the
      # artifact promises to support. Running it on the ubuntu runner would only
      # prove it works on ubuntu.
      - name: Test it on the target distro
        uses: addnab/docker-run-action@v3
        with:
            image: quay.io/pypa/manylinux2014_aarch64
            options: |
              --volume ${{ github.workspace }}:/shared
            shell: bash
            run: |
              set -euo pipefail
              cd /shared
              unzip -q -o ./*.zip
              ./tests/test-artifact.sh

      - name: Upload v${{ env.ONNXRUNTIME_VERSION }}
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./*.zip"
          overwrite: true
          tag: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Publish to huggingface
        if: github.repository_owner == 'csukuangfj'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            set -e
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"
            export GIT_CLONE_PROTECTION_ACTIVE=false
            rm -rf huggingface
            GIT_LFS_SKIP_SMUDGE=1 git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs huggingface
            cd huggingface
            mkdir -p ${{ env.ONNXRUNTIME_VERSION }}
            cp -v ../*.zip ${{ env.ONNXRUNTIME_VERSION }}
            git status
            git lfs track "*.zip"
            git add .
            git commit -m "upload tested linux shared artifacts"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs main
