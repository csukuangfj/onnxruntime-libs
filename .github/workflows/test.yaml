name: test

on:
  push:
    branches:
      - fix-macos
  workflow_dispatch:
    inputs:
      version:
        description: "onnxruntime version to test"
        required: true
        default: '1.30.0'

env:
  ONNXRUNTIME_VERSION:
    |-
    ${{ github.event.inputs.version || '1.30.0' }}

jobs:
  test-onnxruntime-android-arm64-v8a-static-lib-1-30-0-zip:
    name: onnxruntime-android-arm64-v8a-static_lib-1.30.0.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download
        shell: bash
        run: |
          wget -q https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-android-arm64-v8a-static_lib-${{ env.ONNXRUNTIME_VERSION }}.zip
      - name: Extract
        shell: bash
        run: |
          unzip -q onnxruntime-android-arm64-v8a-static_lib-${{ env.ONNXRUNTIME_VERSION }}.zip
          ls -lh
      - name: Flatten directory
        shell: bash
        run: |
          for d in onnxruntime-*/; do
            [ -d "$d" ] || continue
            mv "$d"/* .
            rm -rf "$d"
            break
          done
          ls -lh
      - name: Verify archive contents
        shell: bash
        run: |
          find . -name "*.so" -o -name "*.a" | head -5
          find . -name "*.so" -o -name "*.a" | grep -q . || (echo "ERROR: no .so/.a found"; exit 1)

  test-onnxruntime-android-armeabi-v7a-static-lib-1-30-0-zip:
