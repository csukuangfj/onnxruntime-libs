name: test

on:
  push:
    branches:
      - fix-macos
  workflow_dispatch:
    inputs:
      version:
        description: "onnxruntime version to test"
        required: true
        default: '1.30.0'

env:
  ONNXRUNTIME_VERSION:
    |-
    ${{ github.event.inputs.version || '1.30.0' }}

jobs:
  test-onnxruntime-android-arm64-v8a-static-lib-1-30-0-zip:
    name: onnxruntime-android-arm64-v8a-static_lib-1.30.0.zip
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare workspace
        shell: bash
        run: |
          mkdir -p ort-test
          wget -q -O ort-test/onnxruntime-android-arm64-v8a-static_lib-${{ env.ONNXRUNTIME_VERSION }}.zip https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-android-arm64-v8a-static_lib-${{ env.ONNXRUNTIME_VERSION }}.zip
          cd ort-test
          unzip -q onnxruntime-android-arm64-v8a-static_lib-${{ env.ONNXRUNTIME_VERSION }}.zip
          rm -f onnxruntime-android-arm64-v8a-static_lib-${{ env.ONNXRUNTIME_VERSION }}.zip
          for d in onnxruntime-*/; do
            [ -d "$d" ] || continue
            mv "$d"/* .
            rm -rf "$d"
            break
          done
          mkdir -p tests
          cp ../tests/test_onnxruntime.cc tests/
          ls -lh
      - name: Compile and run in termux
        shell: bash
        run: |
          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/ort-test:/tmp/ort-test \
            termux/termux-docker:aarch64 \
            bash -c '
            apt update -y
            apt install -y clang libc++
            cp -r /tmp/ort-test /data/data/com.termux/files/usr/tmp/ort-test
            cd /data/data/com.termux/files/usr/tmp/ort-test
            chmod -R 777 .
            clang++ -std=c++17 -I include tests/test_onnxruntime.cc -L lib -lonnxruntime -lc++ -lm -llog -o test_version
            ls -lh test_version
            LD_LIBRARY_PATH=./lib ./test_version
            '

