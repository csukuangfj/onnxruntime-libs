    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download
        shell: bash
        run: |
          curl -SL -o onnxruntime-win-x64-MD-Debug-${{ env.ONNXRUNTIME_VERSION }}.tar.bz2 https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-win-x64-MD-Debug-${{ env.ONNXRUNTIME_VERSION }}.tar.bz2
      - name: Extract
        shell: bash
        run: |
          tar xjf onnxruntime-win-x64-MD-Debug-${{ env.ONNXRUNTIME_VERSION }}.tar.bz2
          ls -lh
      - name: Flatten directory
        shell: bash
        run: |
          for d in onnxruntime-*/; do
            [ -d "$d" ] || continue
            mv "$d"/* .
            rm -rf "$d"
            break
          done
          ls -lh
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Delete system onnxruntime.dll
        shell: bash
        run: |
          search_dirs=(
            "/c/Windows"
            "/c/Program Files"
            "/c/Program Files (x86)"
          )
          count=0
          for dir in "${search_dirs[@]}"; do
            if [ -d "$dir" ]; then
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "Deleting: $f"
                rm -f "$f" || true
                count=$((count + 1))
              done < <(find "$dir" -name "onnxruntime.dll" -type f 2>/dev/null || true)
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "No stale onnxruntime.dll found"
          else
            echo "Deleted $count onnxruntime.dll file(s)"
          fi
      - name: Compile and run
        shell: bash
        run: |
          cp -v lib/onnxruntime.dll . 2>/dev/null || true
          MSYS_NO_PATHCONV=1 cl.exe /std:c++17 /EHsc /I include tests/test_onnxruntime.cc /link /LIBPATH:lib onnxruntime.lib
          ./test_onnxruntime.exe

