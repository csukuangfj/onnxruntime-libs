name: test-spm

on:
  push:
    branches:
      - release-v1.27.1
  workflow_dispatch:

jobs:
  test-spm-macos:
    name: Test SPM (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve dependencies
        shell: bash
        run: |
          cd spm-examples/macOS
          swift package resolve
          swift package show-dependencies

      - name: Build and run (macOS)
        shell: bash
        run: |
          cd spm-examples/macOS
          swift build 2>&1
          swift run VersionDemo

  test-spm-ios:
    name: Test SPM (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -skipPackagePluginValidation \
            build 2>&1

          echo "=== iOS build succeeded ==="

  test-spm-visionos:
    name: Test SPM (visionOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for visionOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/visionOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for visionOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "platform=visionOS Simulator,name=Apple Vision Pro" \
            -skipPackagePluginValidation \
            build 2>&1

          echo "=== visionOS build succeeded ==="
