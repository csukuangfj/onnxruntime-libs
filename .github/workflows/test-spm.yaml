name: test-spm

on:
  push:
    branches:
      - test-ci
  workflow_dispatch:

jobs:
  test-spm-macos:
    name: Test SPM (macOS static)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run (macOS)
        shell: bash
        run: |
          cd spm-examples/macOS
          rm -rf .build
          swift package update 2>&1
          swift package show-dependencies
          swift build 2>&1
          swift run VersionDemo

  test-spm-macos-shared:
    name: Test SPM (macOS shared)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run (macOS shared)
        shell: bash
        run: |
          cd spm-examples/macOS-Shared
          rm -rf .build
          swift package update 2>&1
          swift package show-dependencies
          swift build 2>&1
          swift run VersionDemo

  test-spm-ios:
    name: Test SPM (iOS static)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/VersionDemo" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

  test-spm-ios-shared:
    name: Test SPM (iOS shared)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run for iOS Simulator (shared)
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS-Shared

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/VersionDemo" -type f | head -1)
          PRODUCTS_DIR=$(dirname "$BINARY")
          echo "Binary: $BINARY"
          echo "Products: $PRODUCTS_DIR"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          # When xcodebuild builds a shared xcframework, it extracts the framework
          # to Build/Products/<platform>/onnxruntime.framework but does NOT copy it
          # to PackageFrameworks/. The binary's rpath includes PackageFrameworks/,
          # so dyld can't find the dynamic library at runtime with simctl spawn.
          # We copy it manually so dyld can resolve @rpath/onnxruntime.framework.
          echo "=== Copying framework to PackageFrameworks ==="
          FRAMEWORK_SRC="$PRODUCTS_DIR/onnxruntime.framework"
          PKG_FRAMEWORKS="$PRODUCTS_DIR/PackageFrameworks/onnxruntime.framework"
          mkdir -p "$PRODUCTS_DIR/PackageFrameworks"
          cp -R "$FRAMEWORK_SRC/" "$PKG_FRAMEWORKS/"
          echo "Copied framework to $PKG_FRAMEWORKS"

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

  test-spm-visionos:
    name: Test SPM (visionOS static)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run for visionOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/visionOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for visionOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "generic/platform=visionOS Simulator" \
            -skipPackagePluginValidation \
            EXCLUDED_ARCHS=x86_64 \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-xrsimulator/VersionDemo" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting visionOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'Vision' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on visionOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

  test-spm-visionos-shared:
    name: Test SPM (visionOS shared)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run for visionOS Simulator (shared)
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/visionOS-Shared

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for visionOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "generic/platform=visionOS Simulator" \
            -skipPackagePluginValidation \
            EXCLUDED_ARCHS=x86_64 \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-xrsimulator/VersionDemo" -type f | head -1)
          PRODUCTS_DIR=$(dirname "$BINARY")
          echo "Binary: $BINARY"
          echo "Products: $PRODUCTS_DIR"

          echo "=== Booting visionOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'Vision' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          # When xcodebuild builds a shared xcframework, it extracts the framework
          # to Build/Products/<platform>/onnxruntime.framework but does NOT copy it
          # to PackageFrameworks/. The binary's rpath includes PackageFrameworks/,
          # so dyld can't find the dynamic library at runtime with simctl spawn.
          # We copy it manually so dyld can resolve @rpath/onnxruntime.framework.
          echo "=== Copying framework to PackageFrameworks ==="
          FRAMEWORK_SRC="$PRODUCTS_DIR/onnxruntime.framework"
          PKG_FRAMEWORKS="$PRODUCTS_DIR/PackageFrameworks/onnxruntime.framework"
          mkdir -p "$PRODUCTS_DIR/PackageFrameworks"
          cp -R "$FRAMEWORK_SRC/" "$PKG_FRAMEWORKS/"
          echo "Copied framework to $PKG_FRAMEWORKS"

          echo "=== Running on visionOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"
