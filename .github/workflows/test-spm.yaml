name: test-spm

on:
  push:
    branches:
      - release-v1.27.1
  workflow_dispatch:

jobs:
  test-spm-macos:
    name: Test SPM (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run (macOS)
        shell: bash
        run: |
          cd spm-examples/macOS
          rm -rf .build ~/Library/Caches/org.swift.swiftpm/repositories
          swift package resolve
          swift package show-dependencies
          swift build 2>&1
          swift run VersionDemo

  test-spm-ios:
    name: Test SPM (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/VersionDemo" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

  test-spm-visionos:
    name: Test SPM (visionOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run for visionOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/visionOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for visionOS Simulator ==="
          xcodebuild -scheme VersionDemo \
            -destination "generic/platform=visionOS Simulator" \
            -skipPackagePluginValidation \
            EXCLUDED_ARCHS=x86_64 \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-xrsimulator/VersionDemo" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting visionOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'Vision' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on visionOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"
