name: test-linux-shared

# Test the artifacts the linux/aarch64 shared builds produce, then release them.
#
# The build workflows check out microsoft/onnxruntime (to build it), so they
# cannot see this repo's tests/*.sh or tests/test_onnxruntime.cc. Testing here,
# against a downloaded artifact and a checkout of this repo, keeps the build
# logs about building and the test logs about testing -- and nothing has to be
# curl'ed off a branch.
#
# Artifacts are only released after they pass.

on:
  workflow_run:
    workflows:
      - linux-shared-217
      - linux-shared-224
      - linux-shared-228
      - aarch64-shared-217
      - aarch64-shared-224
      - aarch64-shared-228
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id whose artifacts to test"
        required: true

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: test the built artifacts

    steps:
      - name: Checkout this repo (for tests/)
        uses: actions/checkout@v4

      - name: Download the artifacts of the build run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test every artifact
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r d; do
            found=1
            ./tests/test-artifact.sh "$d"
          done < <(find artifacts -maxdepth 1 -type d -name 'onnxruntime-linux-*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::no onnxruntime-linux-* artifact directories to test"
            ls -la artifacts
            exit 1
          fi

      - name: Collect the zips for release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name 'onnxruntime-linux-*.zip' -exec cp -v {} release/ \;
          ls -lh release

      - name: Upload v1.31.0
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "release/*.zip"
          overwrite: true
          tag: v1.31.0

      - name: Publish to huggingface
        if: github.repository_owner == 'csukuangfj'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            set -e
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"
            export GIT_CLONE_PROTECTION_ACTIVE=false
            rm -rf huggingface
            GIT_LFS_SKIP_SMUDGE=1 git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs huggingface
            cd huggingface
            mkdir -p 1.31.0
            cp -v ../release/*.zip ./1.31.0
            git status
            git lfs track "*.zip"
            git add .
            git commit -m "upload tested linux shared artifacts"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs main
