name: macos-xcframework

on:
  push:
    branches:
      - fix-macos-2
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.27.1)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.27.1' }}

jobs:
  macos-xcframework:
    name: macos-${{ matrix.link_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        link_type: ["shared", "static"]

    steps:
      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-macos-xcframework-${{ matrix.link_type }}-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-macos-xcframework-${{ matrix.link_type }}-${{ env.ONNXRUNTIME_VERSION }}-cache-v1

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-macos-xcframework-${{ matrix.link_type }}

      - name: Checkout v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          submodules: true
          ref: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Install dependencies on macos
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install ninja
          which cmake
          cmake --version
          brew install tree
          tree --version

          brew install jq
          which jq

      - name: Patch build settings for macOS only
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          jq '
            del(.build_osx_archs.iphoneos, .build_osx_archs.iphonesimulator) |
            del(.build_params.iphoneos, .build_params.iphonesimulator) |
            .build_params.base += [
              "--compile_no_warning_as_error",
              "--cmake_extra_defines=CMAKE_POLICY_VERSION_MINIMUM=3.5",
              "--cmake_extra_defines=FLATBUFFERS_BUILD_FLATC=OFF"
            ] |
            .build_params.macosx = ["--macos=MacOSX", "--apple_deploy_target=10.15"]
          ' tools/ci_build/github/apple/default_full_apple_framework_build_settings.json \
            > macos_build_settings.json

          # For shared/dynamic framework builds, add --build_shared_lib so that
          # build.py actually creates a shared library (and thus a dynamic framework).
          # Without this, build.py creates a static framework, but --build_dynamic_framework
          # tells build_apple_framework.py to look for onnxruntime.framework instead of
          # static_framework/onnxruntime.framework, causing a FileNotFoundError.
          if [[ "${{ matrix.link_type }}" == "shared" ]]; then
            jq '.build_params.base += ["--build_shared_lib"]' \
              macos_build_settings.json > macos_build_settings_tmp.json
            mv macos_build_settings_tmp.json macos_build_settings.json
          fi

          cat macos_build_settings.json
          git diff .

      - name: Build onnxruntime ${{ env.ONNXRUNTIME_VERSION }} for macOS
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --version

          link_type=${{ matrix.link_type }}
          if [[ $link_type == "shared" ]]; then
            opts="--build_dynamic_framework"
          else
            opts=""
          fi

          echo "opts: $opts"

          INTERMEDIATES=build/apple_framework/intermediates

          for arch in arm64 x86_64; do
            echo "=== Building macosx/$arch ==="
            python3 tools/ci_build/github/apple/build_apple_framework.py \
              --config Release \
              $opts \
              --only_build_single_sysroot_arch_framework macosx $arch \
              macos_build_settings.json \
              2>&1 | tail -5

            # macOS Xcode may place the framework in a different location than
            # what build_apple_framework.py expects (Release/Release-macosx/onnxruntime.framework).
            # Create symlinks to bridge the gap if needed.
            ARCH_DIR=$INTERMEDIATES/macosx_${arch}/Release
            EXPECTED_FW="$ARCH_DIR/Release-macosx/onnxruntime.framework"
            echo "--- Checking framework layout for $arch ---"
            find "$ARCH_DIR" -name "*.framework" -type d 2>/dev/null || true

            if [[ ! -d "$EXPECTED_FW" ]]; then
              if [[ ! -d "$ARCH_DIR/Release-macosx" ]]; then
                # Release-macosx doesn't exist yet; create top-level symlink
                if [[ -d "$ARCH_DIR/Release/Release-macosx" ]]; then
                  ln -sf "Release/Release-macosx" "$ARCH_DIR/Release-macosx"
                elif [[ -d "$ARCH_DIR/Release/Release/onnxruntime.framework" ]]; then
                  ln -sf "Release/Release" "$ARCH_DIR/Release-macosx"
                elif [[ -d "$ARCH_DIR/Release/onnxruntime.framework" ]]; then
                  ln -sf Release "$ARCH_DIR/Release-macosx"
                fi
                if [[ -f "$ARCH_DIR/Release/framework_info.json" ]]; then
                  cp "$ARCH_DIR/Release/framework_info.json" "$ARCH_DIR/Release-macosx/framework_info.json" 2>/dev/null || true
                fi
              fi

              # Release-macosx may exist (created by Xcode) but with framework
              # inside static_framework/ instead of directly.
              if [[ "${{ matrix.link_type }}" == "shared" ]]; then
                # For shared builds, we need the actual dynamic framework.
                # The dynamic framework is at Release/Release/onnxruntime.framework.
                # Create a symlink to it.
                if [[ ! -d "$EXPECTED_FW" ]] && \
                   [[ -d "$ARCH_DIR/Release/Release/onnxruntime.framework" ]]; then
                  ln -sf "../../Release/Release/onnxruntime.framework" "$EXPECTED_FW"
                fi
              else
                # For static builds, create inner symlink to static_framework/.
                if [[ -d "$ARCH_DIR/Release-macosx/static_framework/onnxruntime.framework" ]] && \
                   [[ ! -d "$EXPECTED_FW" ]]; then
                  ln -sf "static_framework/onnxruntime.framework" "$EXPECTED_FW"
                fi
              fi
            fi

            echo "--- Framework path check ---"
            ls -la "$ARCH_DIR/Release-macosx" 2>/dev/null || echo "Release-macosx not found"
            if [[ -d "$EXPECTED_FW" ]]; then
              echo "Expected framework path exists: $EXPECTED_FW"
            else
              echo "ERROR: Expected framework path still missing: $EXPECTED_FW"
            fi
          done

          echo "=== Assembling xcframework ==="
          python3 tools/ci_build/github/apple/build_apple_framework.py \
            --config Release \
            $opts \
            --only_assemble_xcframework \
            macos_build_settings.json

      - name: Create onnxruntime macOS XCFramework
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT=build/apple_framework/framework_out

          ls -lh $BUILD_ROOT
          tree $BUILD_ROOT

      - name: Add modulemap for SPM
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          MODULEMAP='module onnxruntime {
              umbrella header "Headers/onnxruntime_c_api.h"
              export *
              module * { export * }
          }'

          FW_ROOT=build/apple_framework/framework_out/onnxruntime.xcframework
          for slice in "$FW_ROOT"/*/; do
            if [[ -d "$slice/onnxruntime.framework/Headers" ]]; then
              mkdir -p "$slice/onnxruntime.framework/Modules"
              echo "$MODULEMAP" > "$slice/onnxruntime.framework/Modules/module.modulemap"
            fi
          done

      - name: Zip XCFramework
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd build/apple_framework/framework_out
          zip -ry onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}.xcframework.zip \
            onnxruntime.xcframework
          mv *.zip $GITHUB_WORKSPACE/

      - name: Upload artifact xcframework
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}
          path: onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}.zip

      - name: Upload v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.cache-build-result.outputs.cache-hit != 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./*.zip"
          overwrite: true
          tag: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Publish to huggingface
        if: github.repository_owner == 'csukuangfj' && steps.cache-build-result.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            version=${{ env.ONNXRUNTIME_VERSION }}
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"
            export GIT_CLONE_PROTECTION_ACTIVE=false
            rm -rf huggingface
            GIT_LFS_SKIP_SMUDGE=1 git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs huggingface
            cd huggingface
            mkdir -p $version
            cp -v ../onnxruntime-macos-${{ matrix.link_type }}-xcframework*.zip ./$version
            git lfs track "*.zip"
            git add .
            git commit -m "upload onnxruntime-macos-${{ matrix.link_type }}.xcframework $version"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs main
