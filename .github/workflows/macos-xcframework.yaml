name: macos-xcframework

on:
  push:
    branches:
      - release-v1.29.1
      - fix-v1.28.2
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.28.2)"
        required: true

permissions:
  contents: write

env:
  ONNXRUNTIME_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch. Appropriate version if not specified
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.28.2' }}

jobs:
  macos-xcframework:
    name: macos-${{ matrix.link_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        link_type: ["shared", "static"]

    steps:
      - name: Check if workflow artifact already exists
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          name="onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}"
          echo "Checking for workflow artifact: ${name}"
          count=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${name}" \
            --jq '.total_count' 2>/dev/null || echo "0")
          if [ "$count" -gt 0 ] 2>/dev/null; then
            echo "Artifact '${name}' already exists (${count} found), skipping build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Artifact not found, will build"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache build result for ${{ env.ONNXRUNTIME_VERSION }}
        if: steps.release-check.outputs.exists != 'true'
        id: cache-build-result
        uses: actions/cache@v4
        with:
          path: onnxruntime-macos-xcframework-${{ matrix.link_type }}-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-macos-xcframework-${{ matrix.link_type }}-${{ env.ONNXRUNTIME_VERSION }}-cache-v1

      - name: Checkout v${{ env.ONNXRUNTIME_VERSION }}
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          submodules: true
          ref: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Install dependencies on macos
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install ninja
          which cmake
          cmake --version
          brew install tree
          tree --version

          brew install jq
          which jq

      - name: Patch build settings for macOS only
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          jq '
            del(.build_osx_archs.iphoneos, .build_osx_archs.iphonesimulator) |
            del(.build_params.iphoneos, .build_params.iphonesimulator) |
            .build_params.base += [
              "--compile_no_warning_as_error",
              "--cmake_extra_defines=CMAKE_OSX_DEPLOYMENT_TARGET=10.15",
              "--cmake_extra_defines=CMAKE_POLICY_VERSION_MINIMUM=3.5",
              "--cmake_extra_defines=FLATBUFFERS_BUILD_FLATC=OFF",
              "--cmake_extra_defines=onnxruntime_BUILD_UNIT_TESTS=OFF"
            ] |
            .build_params.macosx = ["--macos=MacOSX", "--apple_deploy_target=10.15"]
          ' tools/ci_build/github/apple/default_full_apple_framework_build_settings.json \
            > macos_build_settings.json

          # For shared/dynamic framework builds, add --build_shared_lib so that
          # build.py actually creates a shared library (and thus a dynamic framework).
          # Without this, build.py creates a static framework, but --build_dynamic_framework
          # tells build_apple_framework.py to look for onnxruntime.framework instead of
          # static_framework/onnxruntime.framework, causing a FileNotFoundError.
          if [[ "${{ matrix.link_type }}" == "shared" ]]; then
            jq '.build_params.base += ["--build_shared_lib"]' \
              macos_build_settings.json > macos_build_settings_tmp.json
            mv macos_build_settings_tmp.json macos_build_settings.json
          fi

          cat macos_build_settings.json
          git diff .

      - name: Build onnxruntime ${{ env.ONNXRUNTIME_VERSION }} for macOS
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --version

          # Reduce xcodebuild verbosity by patching build.py to add -quiet
          python3 -c "
          import re
          with open('tools/ci_build/build.py', 'r') as f:
              content = f.read()
          # Add -quiet before -project in xcodebuild invocations
          content = re.sub(r\"(xcodebuild.*?) -project\", r\"\1 -quiet -project\", content)
          with open('tools/ci_build/build.py', 'w') as f:
              f.write(content)
          print('Patched build.py to add -quiet to xcodebuild')
          " || true

          link_type=${{ matrix.link_type }}
          if [[ $link_type == "shared" ]]; then
            opts="--build_dynamic_framework"
          else
            opts=""
          fi

          echo "opts: $opts"

          INTERMEDIATES=build/apple_framework/intermediates

          for arch in arm64 x86_64; do
            echo "=== Building macosx/$arch ==="
            python3 tools/ci_build/github/apple/build_apple_framework.py \
              --config Release \
              $opts \
              --only_build_single_sysroot_arch_framework macosx $arch \
              macos_build_settings.json

            # macOS Xcode may place the framework in a different location than
            # what build_apple_framework.py expects (Release/Release-macosx/onnxruntime.framework).
            # Create symlinks to bridge the gap if needed.
            ARCH_DIR=$INTERMEDIATES/macosx_${arch}/Release
            EXPECTED_FW="$ARCH_DIR/Release-macosx/onnxruntime.framework"
            echo "--- Checking framework layout for $arch ---"
            find "$ARCH_DIR" -name "*.framework" -type d || true

            if [[ ! -d "$EXPECTED_FW" ]]; then
              if [[ ! -d "$ARCH_DIR/Release-macosx" ]]; then
                # Release-macosx doesn't exist yet; create top-level symlink
                if [[ -d "$ARCH_DIR/Release/Release-macosx" ]]; then
                  ln -sf "Release/Release-macosx" "$ARCH_DIR/Release-macosx"
                elif [[ -d "$ARCH_DIR/Release/Release/onnxruntime.framework" ]]; then
                  ln -sf "Release/Release" "$ARCH_DIR/Release-macosx"
                elif [[ -d "$ARCH_DIR/Release/onnxruntime.framework" ]]; then
                  ln -sf Release "$ARCH_DIR/Release-macosx"
                fi
                if [[ -f "$ARCH_DIR/Release/framework_info.json" ]]; then
                  cp "$ARCH_DIR/Release/framework_info.json" "$ARCH_DIR/Release-macosx/framework_info.json" || true
                fi
              fi

              # Release-macosx may exist (created by Xcode) but with framework
              # inside static_framework/ instead of directly.
              if [[ "${{ matrix.link_type }}" == "shared" ]]; then
                # For shared builds, we need the actual dynamic framework.
                # The dynamic framework is at Release/Release/onnxruntime.framework.
                # Note: ARCH_DIR already includes /Release, so we use
                # ARCH_DIR/Release/onnxruntime.framework.
                if [[ ! -d "$EXPECTED_FW" ]] && \
                   [[ -d "$ARCH_DIR/Release/onnxruntime.framework" ]]; then
                  ln -sf "../Release/onnxruntime.framework" "$EXPECTED_FW"
                fi
              else
                # For static builds, create inner symlink to static_framework/.
                if [[ -d "$ARCH_DIR/Release-macosx/static_framework/onnxruntime.framework" ]] && \
                   [[ ! -d "$EXPECTED_FW" ]]; then
                  ln -sf "static_framework/onnxruntime.framework" "$EXPECTED_FW"
                fi
              fi
            fi

            echo "--- Framework path check ---"
            ls -la "$ARCH_DIR/Release-macosx" || echo "Release-macosx not found"
            if [[ -d "$EXPECTED_FW" ]]; then
              echo "Expected framework path exists: $EXPECTED_FW"
            else
              echo "ERROR: Expected framework path still missing: $EXPECTED_FW"
            fi
          done

          echo "=== Assembling xcframework ==="
          python3 tools/ci_build/github/apple/build_apple_framework.py \
            --config Release \
            $opts \
            --only_assemble_xcframework \
            macos_build_settings.json

      - name: Create onnxruntime macOS XCFramework
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT=build/apple_framework/framework_out

          ls -lh $BUILD_ROOT
          tree $BUILD_ROOT

      - name: Add modulemap for SPM
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          MODULEMAP='module onnxruntime {
              umbrella header "Headers/onnxruntime_c_api.h"
              export *
              module * { export * }
          }'

          FW_ROOT=build/apple_framework/framework_out/onnxruntime.xcframework
          for slice in "$FW_ROOT"/*/; do
            if [[ -d "$slice/onnxruntime.framework/Headers" ]]; then
              mkdir -p "$slice/onnxruntime.framework/Modules"
              echo "$MODULEMAP" > "$slice/onnxruntime.framework/Modules/module.modulemap"
            fi
          done

      - name: Fix framework symlinks for macOS
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # build_apple_framework.py creates flat directories instead of proper
          # symlinks.  A correct macOS framework must have:
          #   Versions/Current -> A
          #   Headers          -> Versions/Current/Headers
          #   Modules          -> Versions/Current/Modules
          #   Resources        -> Versions/Current/Resources
          #   onnxruntime      -> Versions/Current/onnxruntime
          #
          # Without these symlinks the binary and headers are duplicated and
          # codesign (Xcode 26) fails with "unsealed contents present in the
          # root directory of an embedded framework".
          # See https://github.com/csukuangfj/onnxruntime-libs/issues/62
          FW_ROOT=build/apple_framework/framework_out/onnxruntime.xcframework
          for slice in "$FW_ROOT"/*/; do
            fw="$slice/onnxruntime.framework"
            [[ -d "$fw/Versions/A" ]] || continue

            # Move top-level entries into Versions/A if they exist at the top
            # level but not yet inside Versions/A
            for entry in Headers Modules Resources; do
              if [[ -d "$fw/$entry" && ! -L "$fw/$entry" ]]; then
                if [[ ! -d "$fw/Versions/A/$entry" ]]; then
                  mv "$fw/$entry" "$fw/Versions/A/$entry"
                else
                  # Versions/A already has it (likely the real copy) – remove
                  # the top-level duplicate.
                  rm -rf "$fw/$entry"
                fi
              fi
            done

            # onnxruntime binary
            if [[ -f "$fw/onnxruntime" && ! -L "$fw/onnxruntime" ]]; then
              if [[ ! -f "$fw/Versions/A/onnxruntime" ]]; then
                mv "$fw/onnxruntime" "$fw/Versions/A/onnxruntime"
              else
                rm -f "$fw/onnxruntime"
              fi
            fi

            # Versions/Current -> A
            if [[ -d "$fw/Versions/Current" && ! -L "$fw/Versions/Current" ]]; then
              rm -rf "$fw/Versions/Current"
            fi
            ln -sf A "$fw/Versions/Current"

            # Top-level symlinks -> Versions/Current/...
            ln -sf Versions/Current/Headers   "$fw/Headers"
            ln -sf Versions/Current/Modules   "$fw/Modules"
            ln -sf Versions/Current/Resources "$fw/Resources"
            ln -sf Versions/Current/onnxruntime "$fw/onnxruntime"

            echo "Fixed symlinks in $fw"
            ls -la "$fw"
            ls -la "$fw/Versions/"
          done

      - name: Verify deployment target
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          binary=$(find build/apple_framework/framework_out -name "onnxruntime" -type f | head -1)
          if [ -z "$binary" ]; then
            echo "WARNING: onnxruntime binary not found, skipping minos check"
            exit 0
          fi

          echo "Checking minos of $binary"
          otool_output=$(otool -l "$binary")
          echo "$otool_output" | grep -E -A4 'LC_BUILD_VERSION' | head -20 || true

          # Universal binaries have minos for each architecture
          failed=0
          while read -r minos; do
            echo "minos: $minos"
            # macos-latest (Apple Silicon) enforces min 11.0, macos-15-intel allows 10.15
            if [[ "$minos" != "10.15" && "$minos" != "11.0" ]]; then
              echo "FAILED: expected minos 10.15 or 11.0, got $minos"
              failed=1
            fi
          done < <(echo "$otool_output" | grep -E -A4 'LC_BUILD_VERSION' | grep minos | awk '{print $2}')

          if [[ $failed -eq 0 ]]; then
            echo "PASSED"
          else
            exit 1
          fi

      - name: Test onnxruntime
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Find the framework inside the xcframework
          fw=$(find build/apple_framework/framework_out -name "onnxruntime.framework" -type d | head -1)
          if [ -z "$fw" ]; then
            echo "WARNING: onnxruntime.framework not found, skipping test"
            exit 0
          fi

          # Download test file
          curl -sL https://raw.githubusercontent.com/csukuangfj/onnxruntime-libs/${{ github.ref }}/tests/test_onnxruntime.cc -o /tmp/test_onnxruntime.cc

          g++ -std=c++17 -o /tmp/test_onnxruntime /tmp/test_onnxruntime.cc \
            -I"$fw/Headers" \
            -F$(dirname "$fw") -framework onnxruntime \
            -framework CoreML -framework Foundation -framework Network \
            -Wl,-rpath,$(dirname "$fw")
          /tmp/test_onnxruntime

      - name: Zip XCFramework
        if: steps.release-check.outputs.exists != 'true' && steps.cache-build-result.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd build/apple_framework/framework_out
          zip -ry onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}.xcframework.zip \
            onnxruntime.xcframework
          mv *.zip $GITHUB_WORKSPACE/

      - name: Prepare cached artifact for upload
        if: steps.release-check.outputs.exists == 'true' || steps.cache-build-result.outputs.cache-hit == 'true'
        shell: bash
        run: |
          cached_dir="onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}"
          zip_name="${cached_dir}.xcframework.zip"
          if [[ -d "$cached_dir" && ! -f "$zip_name" ]]; then
            cd "$cached_dir"
            zip -ry "../${zip_name}" onnxruntime.xcframework
          fi

      - name: Upload artifact xcframework
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}
          path: onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}.xcframework.zip

  test-spm:
    name: test-spm-${{ matrix.link_type }}
    needs: macos-xcframework
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        link_type: ["shared", "static"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}
          path: xcframeworks

      - name: Test local SPM (macOS)
        shell: bash
        run: |
          set -euo pipefail
          version=${{ env.ONNXRUNTIME_VERSION }}
          link_type=${{ matrix.link_type }}
          zip_path="$(pwd)/xcframeworks/onnxruntime-macos-${link_type}-xcframework-${version}.xcframework.zip"

          # Patch root Package.swift: replace all binaryTarget url/checksum with local path
          python3 -c "
          import re
          zip_path = '$zip_path'
          with open('Package.swift') as f:
              content = f.read()
          def replace(m):
              return m.group(1) + '\n            path: \"' + zip_path + '\"\n        '
          content = re.sub(r'(\.binaryTarget\(\s*name: \"[^\"]+\",)\s*\n\s*url: \"[^\"]+\",\s*\n\s*checksum: \"[^\"]+\"', replace, content)
          with open('Package.swift', 'w') as f:
              f.write(content)
          "
          git diff Package.swift

          cd spm-examples/macOS
          sed -i.bak 's|.package(url: "https://github.com/csukuangfj/onnxruntime-libs", branch: "master")|.package(path: "../../")|' Package.swift
          cat Package.swift
          rm -rf .build
          swift package resolve
          swift package show-dependencies
          swift build 2>&1
          swift run VersionDemo

  release:
    name: release-${{ matrix.link_type }}
    needs: test-spm
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        link_type: ["shared", "static"]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-macos-${{ matrix.link_type }}-xcframework-${{ env.ONNXRUNTIME_VERSION }}

      - name: Upload v${{ env.ONNXRUNTIME_VERSION }}
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./*.zip"
          overwrite: true
          tag: v${{ env.ONNXRUNTIME_VERSION }}

      - name: Publish to huggingface
        if: github.repository_owner == 'csukuangfj'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            version=${{ env.ONNXRUNTIME_VERSION }}
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"
            export GIT_CLONE_PROTECTION_ACTIVE=false
            rm -rf huggingface
            GIT_LFS_SKIP_SMUDGE=1 git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs huggingface
            cd huggingface
            mkdir -p $version
            cp -v ../onnxruntime-macos-${{ matrix.link_type }}-xcframework*.zip ./$version
            git lfs track "*.zip"
            git add .
            git commit -m "upload onnxruntime-macos-${{ matrix.link_type }}.xcframework $version"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/onnxruntime-libs main
